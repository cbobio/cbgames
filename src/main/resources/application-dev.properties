spring.application.name=cbgames

# ===============================
# MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cbgames?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY
# ===============================
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ======================================================== #
# REDIS
# ======================================================== #
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=4
spring.data.redis.timeout=60000
spring.data.cache.type=redis